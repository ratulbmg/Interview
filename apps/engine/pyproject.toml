[project]
name = "engine"
version = "0.0.0"
description = "AI interview bot: CV parsing, question selection, the interview loop, and transcript scoring."
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.50",
    "pypdf>=4.3",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pipecat-ai[openai,runner,silero,webrtc,whisper,mlx-whisper,kokoro]>=1.4.0",
    "bullmq>=3.0",
    "httpx>=0.27",
]

[dependency-groups]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
