# =============================================================================
# Docker Compose — Development Environment
# =============================================================================
# Spins up seven services:
#   db             → PostgreSQL 17 + pgvector, local to dev only (persistent
#                     data via named volume)
#   redis          → Redis 7, backs BullMQ (email scheduling, Phase 5)
#   mailhog        → Catches outgoing dev email — SMTP on 1025, web UI on
#                     8025 (see packages/email/src/mailer.ts)
#   api            → Express + nodemon (hot-reload via bind mount)
#   dashboard      → Vite React recruiter dashboard (hot-reload via bind mount)
#   email-worker   → BullMQ worker, no HTTP port
#   agent          → Python interview bot, no HTTP port yet (Phase 2/6)
#
# First time up, the local db starts empty — apply the schema and seed data
# once Phase 1 adds them:
#   yarn db:migrate
#   yarn db:seed
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d          # start
#   docker compose -f docker-compose.dev.yml down            # stop
#   docker compose -f docker-compose.dev.yml logs -f         # tail logs
#   docker compose -f docker-compose.dev.yml build --no-cache  # force rebuild
# =============================================================================

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    name: interview_postgres_data

services:
  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector — dev only
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg17
    container_name: interview-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Redis — backs BullMQ (email scheduling jobs, Phase 5)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: interview-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Mailhog — catches every email packages/email's worker sends in dev, no
  # real SMTP relay involved. Web UI at http://localhost:8025.
  # --------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: interview-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # API — Express + Nodemon + tsx
  # --------------------------------------------------------------------------
  api:
    container_name: interview-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api.dev
    command: yarn workspace api dev
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/${POSTGRES_DB:-interview}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount the entire monorepo for live code sync
      - .:/app
      # ── Anonymous volumes ──
      # These prevent the host's node_modules from shadowing the
      # container's installed node_modules (OS / arch differences).
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/email-worker/node_modules
      - /app/packages/db/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/email/node_modules
      - /app/packages/enums/node_modules
      - /app/packages/shared-schemas/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/prettier-config/node_modules
      - /app/packages/typescript-config/node_modules
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Dashboard — Vite dev server (HMR enabled)
  # --------------------------------------------------------------------------
  dashboard:
    container_name: interview-dashboard
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard.dev
    command: yarn workspace dashboard dev
    ports:
      - "${DASHBOARD_PORT:-3002}:3002"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/email-worker/node_modules
      - /app/packages/db/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/email/node_modules
      - /app/packages/enums/node_modules
      - /app/packages/shared-schemas/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/prettier-config/node_modules
      - /app/packages/typescript-config/node_modules
    depends_on:
      - api
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Email worker — BullMQ, no HTTP port (Phase 4)
  # --------------------------------------------------------------------------
  email-worker:
    container_name: interview-email-worker
    build:
      context: .
      dockerfile: docker/Dockerfile.email-worker.dev
    command: yarn workspace email-worker dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/dashboard/node_modules
      - /app/apps/email-worker/node_modules
      - /app/packages/db/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/email/node_modules
      - /app/packages/enums/node_modules
      - /app/packages/shared-schemas/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/prettier-config/node_modules
      - /app/packages/typescript-config/node_modules
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Interview agent — Python, not part of the yarn workspace (Phase 2/6)
  # --------------------------------------------------------------------------
  agent:
    container_name: interview-agent
    build:
      context: .
      dockerfile: docker/Dockerfile.agent.dev
    command: python -m agent
    environment:
      - REDIS_URL=redis://redis:6379
      - API_URL=http://api:3001
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/interview-agent:/app
    networks:
      - app-network
